.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#FFFFFF;border-radius:20px;padding:36px 36px 28px;width:100%;max-width:440px;box-shadow:0 30px 80px rgba(0,0,0,.28)}
.logo{font-weight:700;font-size:28px;letter-spacing:-1px;display:flex;align-items:center;gap:2px;margin-bottom:22px}
.logo i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#FFD700;margin-top:7px}
.label{font-weight:700;font-size:15px;margin:0 0 8px}
h1{font-size:30px;line-height:1.15;margin:0 0 10px;letter-spacing:-.4px}
p{margin:0 0 18px;line-height:1.5}
label{display:block;font-weight:600;margin-bottom:6px}
.field{position:relative}
input{flex:1;min-width:0;min-height:48px;border:1px solid var(--ink);border-radius:8px;padding:10px 12px;font:inherit}
.field input{width:100%;padding-right:52px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:6px;background:none;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.eye:hover{background:#F3F2F8}
input::-ms-reveal,input::-ms-clear{display:none}
.btn{margin-top:16px;width:100%;min-height:50px;border:0;border-radius:999px;background:var(--btn);color:#FFFFFF;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
.btn:hover{background:var(--btnh)} .btn:active{background:var(--btna)} .btn[disabled]{opacity:.7;cursor:wait}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.err{color:var(--err);font-weight:600;font-size:15px;margin:10px 0 0}.err:empty{margin:0}
.foot{font-size:13px;color:var(--muted);margin:14px 0 0}
@media (max-width:640px){.wrap{align-items:flex-end}.card{padding:28px 22px 22px}h1{font-size:26px}}
</style>
</head>

  <button class="btn" id="go" type="submit">Avaa prototyyppi</button>

 </form>

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(P.i)},key,d(P.c));
  return new TextDecoder().decode(buf);
}
function show_(html){document.open();document.write(html);document.close();}
const f=document.getElementById("f"),pw=document.getElementById("pw"),err=document.getElementById("err"),go=document.getElementById("go"),show=document.getElementById("show");

};
